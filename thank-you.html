    <style>
        :root {
            --blue-dark: #002d62;
            --blue-primary: #004AAD;
            --green-action: #7ED957;
            --text-main: #334155;
            --radius-xl: 24px;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f8fafc;
            text-align: center;
            color: var(--text-main);
        }

        .success-card {
            background: #fff;
            padding: 4rem 2rem;
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px rgba(0,45,98,0.1);
            max-width: 650px;
            width: 90%;
            border: 1px solid rgba(0,45,98,0.05);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(126, 217, 87, 0.1);
            color: #7ED957;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        h1 {
            color: var(--blue-dark);
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            font-weight: 900;
            line-height: 1.1;
        }

        p {
            color: #64748b;
            font-size: 1.2rem;
            line-height: 1.7;
            margin-bottom: 3.5rem;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 500;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem 2.5rem;
            text-decoration: none;
            font-weight: 800;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            max-width: 380px;
            font-size: 1.1rem;
        }

        .btn-primary {
            background: var(--blue-dark);
            color: #fff;
            box-shadow: 0 10px 25px rgba(0,45,98,0.2);
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            background: var(--blue-primary);
            box-shadow: 0 15px 35px rgba(0,45,98,0.3);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--blue-dark);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .footer-nav {
            margin-top: 4rem;
            display: flex;
            gap: 2.5rem;
            justify-content: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 2.5rem;
        }

        .footer-nav a {
            color: var(--blue-dark);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .footer-nav a:hover {
            color: var(--blue-primary);
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.1rem; }
            p { font-size: 1.1rem; }
            .footer-nav { flex-direction: column; gap: 1.2rem; }
        }
    </style>
</head>
